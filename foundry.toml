[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
evm_version = "cancun"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
fuzz = { runs = 256 }
invariant = { runs = 64, depth = 32 }
fs_permissions = [{ access = "read-write", path = "./" }]

[profile.ci]
fuzz = { runs = 10000 }
invariant = { runs = 256, depth = 64 }

