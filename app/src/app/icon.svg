<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Outer Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#00F0FF" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#00F0FF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Middle Radial Aura -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#00F0FF" stop-opacity="0.4"/>
      <stop offset="85%" stop-color="#00F0FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Inner Dot Core with Specular Luminous Center -->
    <radialGradient id="dotCore" cx="38%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#B2F9FF"/>
      <stop offset="55%" stop-color="#00F0FF"/>
      <stop offset="90%" stop-color="#00D2E5"/>
      <stop offset="100%" stop-color="#009FB2"/>
    </radialGradient>
  </defs>

  <!-- Dark Rounded Squircle Background (Uniswap dark theme style) -->
  <rect x="8" y="8" width="496" height="496" rx="124" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6"/>

  <!-- Ambient Diffuse Glow behind Dot -->
  <circle cx="256" cy="256" r="215" fill="url(#ambientGlow)"/>

  <!-- Concentrated Luminous Aura reproducing the logo's shadow-[0_0_10px_#00F0FF] -->
  <circle cx="256" cy="256" r="140" fill="url(#auraGlow)"/>

  <!-- Crisp Core of the 'i' Dot -->
  <circle cx="256" cy="256" r="80" fill="url(#dotCore)"/>

  <!-- Inner Sparkle Highlight -->
  <circle cx="230" cy="230" r="20" fill="#FFFFFF" opacity="0.9"/>
</svg>
